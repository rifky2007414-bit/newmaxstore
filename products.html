<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products — MAX STORE</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="/">MAX <b>STORE</b></a><a class="btn" href="/cart.html">Cart (<span data-cart-count>0</span>)</a><a class="btn primary" href="/login.html">Login</a></div></header><main class="container"><div class="section-title"><h1>Products</h1></div><div class="toolbar"><input class="input" id="search" placeholder="Search products..."><select class="select" id="category"><option value="">All categories</option></select><select class="select" id="sort"><option value="latest">Latest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div id="list" class="products"><div class="empty">Loading...</div></div></main><script src="/js/config.js"></script><script src="/js/app.js"></script><script>
let all=[];const params=new URLSearchParams(location.search);const catParam=params.get('category')||'';document.getElementById('category').innerHTML='<option value="">All categories</option>'+CATEGORIES.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');document.getElementById('category').value=catParam;
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),cat=document.getElementById('category').value,sort=document.getElementById('sort').value;let a=all.filter(x=>(!cat||x.category===cat)&&(!q||String(x.name).toLowerCase().includes(q)||String(x.category).toLowerCase().includes(q)));if(sort==='low')a.sort((x,y)=>x.price-y.price);if(sort==='high')a.sort((x,y)=>y.price-x.price);document.getElementById('list').innerHTML=a.map(x=>'<article class="card product-card"><img class="product-image" src="'+esc(x.image||'')+'" alt=""><h3>'+esc(x.name)+'</h3><div class="muted">'+esc(x.category)+'</div><div class="price">'+money(x.price)+'</div><div class="muted">Stock: '+Number(x.stock||0)+'</div><button class="btn primary" style="margin-top:10px" onclick="addToCart('+JSON.stringify(x).replace(/</g,'\\u003c')+')">Add to cart</button></article>').join('')||'<div class="empty">No matching products.</div>'}
['search','category','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));(async()=>{try{const r=await api('products');all=r.products||[];render()}catch(e){document.getElementById('list').innerHTML='<div class="empty"><b>Could not load products.</b><br>'+esc(e.message)+'</div>'}})();
</script></body></html>
