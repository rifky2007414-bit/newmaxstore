<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="navin"><a class="logo" href="/index.html">MAX <span>STORE</span></a><div class="navlinks"><a href="/index.html">Home</a><a href="/products.html">Products</a><a href="/products.html?category=Fashion">Fashion</a><a href="/products.html?category=Electronics">Electronics</a><a href="/products.html?category=Photo%20%26%20Camera">Photo & Camera</a></div><a href="/cart.html" class="btn">Cart <span id="cartCount">0</span></a><a href="/login.html" class="btn primary">Login</a></div></nav><main class="container"><h1>Products</h1><div class="toolbar"><input class="input" id="q" placeholder="Search products"><select id="cat"><option value="">All categories</option></select><select id="sort"><option value="new">Latest</option><option value="low">Price low</option><option value="high">Price high</option></select></div><div class="products" id="list">Loading...</div></main><script src="/js/app.js"></script><script>
CATEGORIES.forEach(c=>cat.innerHTML+=`<option>${esc(c)}</option>`);const par=new URLSearchParams(location.search);if(par.get("category"))cat.value=par.get("category");let all=[];
async function load(){try{all=(await api("products")).products||[];render()}catch(e){list.innerHTML="<p class=error>"+esc(e.message)+"</p>"}}function render(){let x=all.filter(p=>(!cat.value||p.category===cat.value)&&(!q.value||String(p.name).toLowerCase().includes(q.value.toLowerCase())));if(sort.value==="low")x.sort((a,b)=>a.price-b.price);if(sort.value==="high")x.sort((a,b)=>b.price-a.price);list.innerHTML=x.map(p=>`<div class="card product"><img src="${esc(p.image||"https://placehold.co/600x600/08101d/ffffff?text=MAX+STORE")}"><b>${esc(p.name)}</b><div class=muted>${esc(p.category)}</div><div class=price>${money(p.price)}</div><button class="btn primary" onclick='add(${JSON.stringify(p)})'>Add to Cart</button></div>`).join("")||"<p class=muted>No products found.</p>"}function add(p){let c=cart(),x=c.find(i=>i.productId===p.productId);x?x.qty++:c.push({...p,qty:1});setCart(c);alert("Added")}q.oninput=cat.onchange=sort.onchange=render;load();
</script></body></html>
