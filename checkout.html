<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="navin"><a class="logo" href="/index.html">MAX <span>STORE</span></a><div class="navlinks"><a href="/index.html">Home</a><a href="/products.html">Products</a><a href="/products.html?category=Fashion">Fashion</a><a href="/products.html?category=Electronics">Electronics</a><a href="/products.html?category=Photo%20%26%20Camera">Photo & Camera</a></div><a href="/cart.html" class="btn">Cart <span id="cartCount">0</span></a><a href="/login.html" class="btn primary">Login</a></div></nav><main class="container"><div class="form panel"><h1>Checkout</h1><div class=field><label>Payment</label><select id=payment><option>Cash on Delivery</option><option>Online Payment</option><option>Card Payment</option></select></div><div class=field><label>Delivery</label><select id=delivery><option>Kurunegala District Local Delivery</option><option>Sri Lanka Courier</option></select></div><div class=field><label>District</label><input class=input id=district value=Kurunegala></div><div class=field><label>Address</label><textarea id=address rows=4></textarea></div><h3 id=total></h3><p class=muted>Real online/card processing needs a payment gateway. Card/CVV data is never stored in Sheets.</p><button class="btn primary" onclick=place()>Place Order</button><p id=msg></p></div></main><script src=/js/app.js></script><script>const me=session(),cc=cart();if(!me)location.href="/login.html";total.textContent="Total: "+money(cc.reduce((a,x)=>a+x.price*x.qty,0));async function place(){try{let j=await api("createOrder",{userId:me.userId,items:cc,total:cc.reduce((a,x)=>a+x.price*x.qty,0),paymentMethod:payment.value,deliveryMethod:delivery.value,district:district.value,address:address.value});localStorage.removeItem("maxstoreCart");alert("Order placed: "+j.orderId);location.href="/buyer/dashboard.html"}catch(e){msg.className="error";msg.textContent=e.message}}</script></body></html>
