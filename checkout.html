<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — MAX STORE</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container"><div class="card form-card"><div class="eyebrow">MAX STORE</div><h1>Checkout</h1><div id="summary" class="card" style="margin-bottom:18px"></div><form id="checkoutForm"><div class="field"><label>Payment method</label><select class="select" id="payment"><option value="COD">Cash on Delivery</option><option value="Online">Online Payment</option><option value="Bank Transfer">Bank Transfer</option></select></div><div class="field"><label>Delivery method</label><select class="select" id="delivery"><option value="Local Delivery">Kurunegala District Local Delivery</option><option value="Courier">Sri Lanka Courier</option></select></div><div class="field"><label>District</label><input class="input" id="district" value="Kurunegala" required></div><div class="field"><label>Delivery address</label><textarea class="input" id="address" rows="4" required></textarea></div><button class="btn primary" id="place" type="submit" style="width:100%">Place Order</button></form><div id="message" class="message"></div><p class="muted" style="font-size:12px;margin-top:15px">Online/card processing requires a real payment gateway. MAX STORE does not store card numbers or CVV in Google Sheets.</p></div></main><script src="/js/config.js"></script><script src="/js/app.js"></script><script>
const me=requireLogin(),items=cart();if(!me){}else{const total=items.reduce((n,x)=>n+Number(x.price||0)*Number(x.qty||1),0);document.getElementById('summary').innerHTML='<div class="muted">Items</div><h2>'+money(total)+'</h2>';document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('place'),msg=document.getElementById('message');if(!items.length){setMsg(msg,'Your cart is empty.','error');return}btn.disabled=true;btn.textContent='Placing order...';try{const r=await api('createOrder',{userId:me.userId,items,total,paymentMethod:document.getElementById('payment').value,deliveryMethod:document.getElementById('delivery').value,district:document.getElementById('district').value.trim(),address:document.getElementById('address').value.trim()});localStorage.removeItem('maxstoreCart');setMsg(msg,'Order '+r.orderId+' created successfully.','success');setTimeout(()=>location.href='/buyer/dashboard.html',900)}catch(err){setMsg(msg,err.message,'error');btn.disabled=false;btn.textContent='Place Order'}})}
</script></body></html>
