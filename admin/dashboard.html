<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX STORE Owner</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="navin"><a class="logo" href="/index.html">MAX <span>STORE</span></a><div class="navlinks"><a href="/index.html">Home</a><a href="/products.html">Products</a><a href="/products.html?category=Fashion">Fashion</a><a href="/products.html?category=Electronics">Electronics</a><a href="/products.html?category=Photo%20%26%20Camera">Photo & Camera</a></div><a href="/cart.html" class="btn">Cart <span id="cartCount">0</span></a><a href="/login.html" class="btn primary">Login</a></div></nav><main class="container"><div style="display:flex;justify-content:space-between"><div><h1>MAX STORE OWNER</h1><p class=muted>Admin control center</p></div><button class=btn onclick=logout()>Logout</button></div><div class=grid><div class="card stat"><span class=muted>Users</span><b id=u>0</b></div><div class="card stat"><span class=muted>Sellers</span><b id=s>0</b></div><div class="card stat"><span class=muted>Products</span><b id=p>0</b></div><div class="card stat"><span class=muted>Sales</span><b id=sales>Rs. 0</b></div><div class="card stat"><span class=muted>Admin 10%</span><b id=comm>Rs. 0</b></div><div class="card stat"><span class=muted>Seller 90%</span><b id=sh>Rs. 0</b></div></div><div class=tabs><button class="tab active" data-x=orders>Orders</button><button class=tab data-x=users>Users</button><button class=tab data-x=sellers>Sellers</button><button class=tab data-x=products>Products</button><button class=tab data-x=withdrawals>Withdrawals</button></div><div id=orders class="section active panel"></div><div id=users class="section panel"></div><div id=sellers class="section panel"></div><div id=products class="section panel"></div><div id=withdrawals class="section panel"></div></main><script src=/js/app.js></script><script>
const me=requireRole(["admin"]);document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.section").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.x).classList.add("active")});
async function load(){try{let [a,b,c,d,e]=await Promise.all([api("users"),api("sellers"),api("allProducts"),api("orders"),api("withdrawals")]),us=a.users||[],se=b.sellers||[],pr=c.products||[],or=d.orders||[],wi=e.withdrawals||[];u.textContent=us.length;s.textContent=se.length;p.textContent=pr.length;let total=or.reduce((a,o)=>a+o.amount,0);sales.textContent=money(total);comm.textContent=money(total*.1);sh.textContent=money(total*.9);
orders.innerHTML=tbl(["Order","User","Amount","Commission","Seller","Payment","Status","Action"],or.map(o=>[o.orderId,o.userId,money(o.amount),money(o.commission),money(o.sellerAmount),o.paymentMethod,o.status,`<select onchange="os('${o.orderId}',this.value)"><option>Change</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select>`]));
users.innerHTML=tbl(["ID","Name","Email","Role","Status"],us.map(x=>[x.userId,x.name,x.email,x.role,x.status]));
sellers.innerHTML=tbl(["Seller","Store","Status","Action"],se.map(x=>[x.sellerId,x.storeName,x.status,String(x.status).toLowerCase()=="pending"?`<button class="btn ok" onclick="ss('${x.sellerId}','Approved')">Approve</button> <button class="btn danger" onclick="ss('${x.sellerId}','Rejected')">Reject</button>`:"—"]));
products.innerHTML=tbl(["ID","Name","Seller","Price","Stock","Status","Action"],pr.map(x=>[x.productId,x.name,x.sellerId,money(x.price),x.stock,x.status,String(x.status).toLowerCase()=="pending"?`<button class="btn ok" onclick="ps('${x.productId}','Approved')">Approve</button> <button class="btn danger" onclick="ps('${x.productId}','Rejected')">Reject</button>`:"—"]));
withdrawals.innerHTML=tbl(["ID","Seller","Amount","Status","Action"],wi.map(x=>[x.withdrawalId,x.sellerId,money(x.amount),x.status,String(x.status).toLowerCase()=="pending"?`<button class="btn ok" onclick="ws('${x.withdrawalId}','Paid')">Paid</button> <button class="btn danger" onclick="ws('${x.withdrawalId}','Rejected')">Reject</button>`:"—"]));
}catch(e){document.querySelector(".section.active").innerHTML="<p class=error>"+esc(e.message)+"</p>"}}
function tbl(h,rs){return "<div class=tablewrap><table><tr>"+h.map(x=>"<th>"+x+"</th>").join("")+"</tr>"+rs.map(r=>"<tr>"+r.map(x=>"<td>"+esc(x)+"</td>").join("")+"</tr>").join("")+"</table></div>"}
async function ss(id,v){await api("updateSellerStatus",{sellerId:id,status:v});load()}async function ps(id,v){await api("updateProductStatus",{productId:id,status:v});load()}async function os(id,v){if(v&&v!="Change"){await api("updateOrderStatus",{orderId:id,status:v});load()}}async function ws(id,v){await api("updateWithdrawalStatus",{withdrawalId:id,status:v});load()}if(me)load();
</script></body></html>
