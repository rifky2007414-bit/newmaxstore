<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX STORE Owner Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="/">MAX <b>STORE</b></a><span class="muted">OWNER CONTROL CENTER</span><button class="btn danger" id="logoutBtn">Logout</button></div></header><main class="container"><div class="dashboard-head"><div><div class="eyebrow">ADMIN</div><h1>MAX STORE OWNER</h1><p class="muted">Manage users, sellers, products, orders and withdrawals.</p></div></div><div class="stats"><div class="card stat"><div class="label">Users</div><div class="value" id="usersN">0</div></div><div class="card stat"><div class="label">Sellers</div><div class="value" id="sellersN">0</div></div><div class="card stat"><div class="label">Products</div><div class="value" id="productsN">0</div></div><div class="card stat"><div class="label">Sales</div><div class="value" id="salesN">Rs. 0.00</div></div></div><div class="stats" style="margin-top:14px"><div class="card stat"><div class="label">Admin commission 10%</div><div class="value" id="commN">Rs. 0.00</div></div><div class="card stat"><div class="label">Seller share 90%</div><div class="value" id="sellerN">Rs. 0.00</div></div><div class="card stat"><div class="label">Pending products</div><div class="value" id="pendingP">0</div></div><div class="card stat"><div class="label">Pending sellers</div><div class="value" id="pendingS">0</div></div></div><div class="tabs"><button class="tab active" data-tab="ordersPanel">Orders</button><button class="tab" data-tab="usersPanel">Users</button><button class="tab" data-tab="sellersPanel">Sellers</button><button class="tab" data-tab="productsPanel">Products</button><button class="tab" data-tab="withdrawalsPanel">Withdrawals</button></div><section id="ordersPanel" class="card tab-panel active"></section><section id="usersPanel" class="card tab-panel"></section><section id="sellersPanel" class="card tab-panel"></section><section id="productsPanel" class="card tab-panel"></section><section id="withdrawalsPanel" class="card tab-panel"></section><div id="error" class="message"></div></main><script src="/js/config.js"></script><script src="/js/app.js"></script><script>
const me=requireLogin(['admin']);document.getElementById('logoutBtn').onclick=logout;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.tab-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
async function load(){const err=document.getElementById('error');err.textContent='';try{const [u,s,p,o,w]=await Promise.all([api('users',{adminUserId:me.userId}),api('sellers',{adminUserId:me.userId}),api('allProducts',{adminUserId:me.userId}),api('orders',{adminUserId:me.userId}),api('withdrawals',{adminUserId:me.userId})]);const us=u.users||[],ss=s.sellers||[],ps=p.products||[],os=o.orders||[],ws=w.withdrawals||[];usersN.textContent=us.length;sellersN.textContent=ss.length;productsN.textContent=ps.length;pendingP.textContent=ps.filter(x=>String(x.status).toLowerCase()==='pending').length;pendingS.textContent=ss.filter(x=>String(x.status).toLowerCase()==='pending').length;const sales=os.reduce((n,x)=>n+Number(x.amount||0),0);salesN.textContent=money(sales);commN.textContent=money(os.reduce((n,x)=>n+Number(x.commission||0),0));sellerN.textContent=money(os.reduce((n,x)=>n+Number(x.sellerAmount||0),0));
document.getElementById('ordersPanel').innerHTML=renderTable(['Order','User','Amount','Commission','Seller','Payment','Status','Action'],os.map(x=>[esc(x.orderId),esc(x.userId),money(x.amount),money(x.commission),money(x.sellerAmount),esc(x.paymentMethod),esc(x.status),'<select class="select" onchange="updateOrder(\''+esc(x.orderId)+'\',this.value)"><option value="">Change</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select>']));
document.getElementById('usersPanel').innerHTML=renderTable(['ID','Name','Email','Phone','Role','Status'],us.map(x=>[esc(x.userId),esc(x.name),esc(x.email),esc(x.phone),esc(x.role),esc(x.status)]));
document.getElementById('sellersPanel').innerHTML=renderTable(['Seller','Store','Phone','Status','Action'],ss.map(x=>[esc(x.sellerId),esc(x.storeName),esc(x.phone),esc(x.status),String(x.status).toLowerCase()==='pending'?'<button class="btn ok" onclick="updateSeller(\''+esc(x.sellerId)+'\',\'Approved\')">Approve</button> <button class="btn danger" onclick="updateSeller(\''+esc(x.sellerId)+'\',\'Rejected\')">Reject</button>':'—']));
document.getElementById('productsPanel').innerHTML=renderTable(['ID','Name','Seller','Price','Stock','Status','Action'],ps.map(x=>[esc(x.productId),esc(x.name),esc(x.sellerId),money(x.price),x.stock,esc(x.status),String(x.status).toLowerCase()==='pending'?'<button class="btn ok" onclick="updateProduct(\''+esc(x.productId)+'\',\'Approved\')">Approve</button> <button class="btn danger" onclick="updateProduct(\''+esc(x.productId)+'\',\'Rejected\')">Reject</button>':'—']));
document.getElementById('withdrawalsPanel').innerHTML=renderTable(['ID','Seller','Amount','Status','Action'],ws.map(x=>[esc(x.withdrawalId),esc(x.sellerId),money(x.amount),esc(x.status),String(x.status).toLowerCase()==='pending'?'<button class="btn ok" onclick="updateWithdrawal(\''+esc(x.withdrawalId)+'\',\'Paid\')">Mark paid</button> <button class="btn danger" onclick="updateWithdrawal(\''+esc(x.withdrawalId)+'\',\'Rejected\')">Reject</button>':'—']))}catch(e){setMsg(err,e.message,'error')}}
async function updateSeller(id,status){await api('updateSellerStatus',{adminUserId:me.userId,sellerId:id,status});load()}async function updateProduct(id,status){await api('updateProductStatus',{adminUserId:me.userId,productId:id,status});load()}async function updateOrder(id,status){if(status)await api('updateOrderStatus',{adminUserId:me.userId,orderId:id,status}).then(load)}async function updateWithdrawal(id,status){await api('updateWithdrawalStatus',{adminUserId:me.userId,withdrawalId:id,status}).then(load)}if(me)load();
</script></body></html>
