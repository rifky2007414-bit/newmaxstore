<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="navin"><a class="logo" href="/index.html">MAX <span>STORE</span></a><div class="navlinks"><a href="/index.html">Home</a><a href="/products.html">Products</a><a href="/products.html?category=Fashion">Fashion</a><a href="/products.html?category=Electronics">Electronics</a><a href="/products.html?category=Photo%20%26%20Camera">Photo & Camera</a></div><a href="/cart.html" class="btn">Cart <span id="cartCount">0</span></a><a href="/login.html" class="btn primary">Login</a></div></nav><main class="container"><h1>Cart</h1><div class="grid2"><div class="panel" id="items"></div><div class="panel"><h2>Summary</h2><h3 id="sum"></h3><a class="btn primary" href="/checkout.html">Checkout</a></div></div></main><script src="/js/app.js"></script><script>function render(){let c=cart();items.innerHTML=c.length?c.map((x,i)=>`<div class=cartline><span><b>${esc(x.name)}</b><br>${money(x.price)} × ${x.qty}</span><button class="btn danger" onclick="rm(${i})">Remove</button></div>`).join(""):"<p class=muted>Cart is empty.</p>";sum.textContent=money(c.reduce((a,x)=>a+x.price*x.qty,0))}function rm(i){let c=cart();c.splice(i,1);setCart(c);render()}render()</script></body></html>
