<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — MAX STORE</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="/">MAX <b>STORE</b></a><a class="btn primary" href="/products.html">Continue shopping</a></div></header><main class="container"><div class="section-title"><h1>Your Cart</h1></div><div class="two"><div class="card" id="items"></div><aside class="card"><h2>Summary</h2><p class="muted">Items total</p><h2 id="sum">Rs. 0.00</h2><a class="btn primary" style="width:100%" href="/checkout.html">Checkout</a></aside></div></main><script src="/js/config.js"></script><script src="/js/app.js"></script><script>
function render(){const c=cart(),box=document.getElementById('items');box.innerHTML=c.length?c.map((x,i)=>'<div class="cart-row"><div><b>'+esc(x.name)+'</b><div class="muted">'+money(x.price)+' × '+x.qty+'</div></div><div><b>'+money(Number(x.price)*Number(x.qty))+'</b><br><button class="btn danger" onclick="removeItem('+i+')">Remove</button></div></div>').join(''):'<div class="empty">Your cart is empty.<br><a class="btn primary" href="/products.html" style="margin-top:12px">Shop now</a></div>';document.getElementById('sum').textContent=money(c.reduce((n,x)=>n+Number(x.price||0)*Number(x.qty||1),0))}function removeItem(i){const c=cart();c.splice(i,1);saveCart(c);render()}render();
</script></body></html>
