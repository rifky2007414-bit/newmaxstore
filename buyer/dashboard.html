<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="navin"><a class="logo" href="/index.html">MAX <span>STORE</span></a><div class="navlinks"><a href="/index.html">Home</a><a href="/products.html">Products</a><a href="/products.html?category=Fashion">Fashion</a><a href="/products.html?category=Electronics">Electronics</a><a href="/products.html?category=Photo%20%26%20Camera">Photo & Camera</a></div><a href="/cart.html" class="btn">Cart <span id="cartCount">0</span></a><a href="/login.html" class="btn primary">Login</a></div></nav><main class="container"><div style="display:flex;justify-content:space-between"><div><h1>Buyer Dashboard</h1><p class=muted id=welcome></p></div><button class=btn onclick=logout()>Logout</button></div><div class=grid><div class="card stat"><span class=muted>Orders</span><b id=count>0</b></div><div class="card stat"><span class=muted>Total Spent</span><b id=spent>Rs. 0</b></div></div><div class=panel><h2>My Orders</h2><div class=tablewrap id=orders>Loading...</div></div></main><script src=/js/app.js></script><script>const me=requireRole(["buyer","both"]);if(me){welcome.textContent="Welcome, "+me.name;load()}async function load(){try{let x=(await api("orders",{userId:me.userId})).orders||[];count.textContent=x.length;spent.textContent=money(x.reduce((a,o)=>a+o.amount,0));orders.innerHTML="<table><tr><th>Order</th><th>Amount</th><th>Payment</th><th>Status</th></tr>"+x.map(o=>`<tr><td>${esc(o.orderId)}</td><td>${money(o.amount)}</td><td>${esc(o.paymentMethod)}</td><td>${esc(o.status)}</td></tr>`).join("")+"</table>"}catch(e){orders.innerHTML="<p class=error>"+esc(e.message)+"</p>"}}</script></body></html>
