<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer Dashboard — MAX STORE</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="/">MAX <b>STORE</b></a><a class="btn" href="/products.html">Shop</a><a class="btn" href="/cart.html">Cart (<span data-cart-count>0</span>)</a><button class="btn danger" id="logoutBtn">Logout</button></div></header><main class="container"><div class="dashboard-head"><div><div class="eyebrow">BUYER ACCOUNT</div><h1>Welcome, <span id="name"></span></h1></div></div><div class="stats"><div class="card stat"><div class="label">Orders</div><div class="value" id="ordersCount">0</div></div><div class="card stat"><div class="label">Spent</div><div class="value" id="spent">Rs. 0.00</div></div><div class="card stat"><div class="label">Account</div><div class="value" id="role">Buyer</div></div><div class="card stat"><div class="label">Status</div><div class="value" id="status">Active</div></div></div><section class="card" style="margin-top:20px"><h2>My Orders</h2><div id="orders"></div></section><section id="sellerAccess" class="card" style="margin-top:20px;display:none"><h2>Seller access</h2><p class="muted">This account is registered as Buyer & Seller.</p><a class="btn primary" href="/seller/dashboard.html">Open Seller Dashboard</a></section></main><script src="/js/config.js"></script><script src="/js/app.js"></script><script>
const me=requireLogin(['buyer','both']);document.getElementById('logoutBtn').onclick=logout;if(me){document.getElementById('name').textContent=me.name||'';document.getElementById('role').textContent=me.role==='both'?'Buyer & Seller':'Buyer';document.getElementById('status').textContent=me.status||'active';(async()=>{try{const r=await api('orders',{userId:me.userId});const os=(r.orders||[]).filter(x=>String(x.userId)===String(me.userId));document.getElementById('ordersCount').textContent=os.length;document.getElementById('spent').textContent=money(os.reduce((n,x)=>n+Number(x.amount||0),0));document.getElementById('orders').innerHTML=renderTable(['Order','Amount','Payment','Delivery','Status','Created'],os.map(x=>[esc(x.orderId),money(x.amount),esc(x.paymentMethod),esc(x.deliveryMethod),esc(x.status),esc(x.createdAt)]));if(me.role==='both')document.getElementById('sellerAccess').style.display='block'}catch(e){document.getElementById('orders').innerHTML='<p class="message error">'+esc(e.message)+'</p>'}})()}
</script></body></html>
