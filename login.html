<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX STORE Login</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container"><div class="card form"><div class="logo" style="text-align:center">MAX STORE</div><p class="muted" style="text-align:center">One Login • Buyer • Seller • Admin</p><form id="f"><label>Email</label><input class="input" id="email" type="email" required><label>Password</label><input class="input" id="password" type="password" required><button class="btn primary" style="width:100%" id="go">Login</button></form><p id="msg"></p><p class="muted" style="text-align:center">No account? <a href="/register.html" style="color:#70a0ff">Create account</a></p></div></main><script src="/js/app.js"></script><script>f.addEventListener('submit',async e=>{e.preventDefault();go.disabled=true;go.textContent='Logging in...';try{const r=await api('login',{email:email.value.trim().toLowerCase(),password:password.value});saveSession(r.user);localStorage.setItem('MAXSTORE_USER',JSON.stringify(r.user));localStorage.setItem('MAXSTORE_ROLE',r.user.role);const role=String(r.user.role).toLowerCase();if(role==='admin')location.href='/admin/dashboard.html';else if(role==='seller')location.href='/seller/dashboard.html';else location.href='/buyer/dashboard.html'+(role==='both'?'?mode=both':'')}catch(x){msg.className='error';msg.textContent=x.message;go.disabled=false;go.textContent='Login'}});</script></body></html>
