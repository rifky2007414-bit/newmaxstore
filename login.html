<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — MAX STORE</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container"><div class="card form-card"><div class="eyebrow">MAX STORE</div><h1>Welcome back</h1><p class="muted">One secure login for Buyer, Seller, Buyer & Seller and Admin.</p><form id="loginForm" novalidate><div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" id="loginBtn" type="submit" style="width:100%">Login</button></form><div id="message" class="message"></div><p class="muted" style="text-align:center;margin-top:22px">New to MAX STORE? <a href="/register.html" style="color:#75a1ff">Create an account</a></p><p style="text-align:center"><a class="muted" href="/">← Back to store</a></p></div></main><script src="/js/config.js"></script><script src="/js/app.js"></script><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('loginBtn'),msg=document.getElementById('message');btn.disabled=true;btn.textContent='Signing in...';msg.className='message';msg.textContent='';try{const r=await api('login',{email:document.getElementById('email').value.trim().toLowerCase(),password:document.getElementById('password').value});if(!r.user)throw new Error('Login response did not contain a user.');setSession(r.user);localStorage.setItem('MAXSTORE_USER',JSON.stringify(r.user));localStorage.setItem('MAXSTORE_ROLE',r.user.role);const role=String(r.user.role||'').toLowerCase();if(role==='admin')location.href='/admin/dashboard.html';else if(role==='seller')location.href='/seller/dashboard.html';else location.href='/buyer/dashboard.html'+(role==='both'?'?mode=both':'')}catch(err){setMsg(msg,err.message,'error');btn.disabled=false;btn.textContent='Login'}});
</script></body></html>
