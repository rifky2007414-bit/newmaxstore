<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="navin"><a class="logo" href="/index.html">MAX <span>STORE</span></a><div class="navlinks"><a href="/index.html">Home</a><a href="/products.html">Products</a><a href="/products.html?category=Fashion">Fashion</a><a href="/products.html?category=Electronics">Electronics</a><a href="/products.html?category=Photo%20%26%20Camera">Photo & Camera</a></div><a href="/cart.html" class="btn">Cart <span id="cartCount">0</span></a><a href="/login.html" class="btn primary">Login</a></div></nav><main class="container"><div class="form panel"><h1>Login</h1><div class=field><label>Login as</label><select id=role><option value=buyer>Buyer</option><option value=seller>Seller</option></select></div><div class=field><label>Email</label><input class=input id=email></div><div class=field><label>Password</label><input class=input id=password type=password></div><button class="btn primary" onclick=go()>Login</button><p id=msg></p><p class=muted>New user? <a href=/register.html>Register</a></p></div></main><script src=/js/app.js></script><script>async function go(){try{let j=await api("login",{email:email.value,password:password.value,loginRole:role.value});saveSession(j.user);location.href=j.user.role==="admin"?"/admin/dashboard.html":j.user.role==="seller"?"/seller/dashboard.html":"/buyer/dashboard.html"}catch(e){msg.className="error";msg.textContent=e.message}}</script></body></html>
