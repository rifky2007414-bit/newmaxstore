<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX STORE - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#101b3d 0%,#08090d 45%,#030408 100%);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    padding:35px;
    border-radius:24px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-size:34px;
    letter-spacing:2px;
}

.logo p{
    color:#9da5b8;
    margin-top:8px;
}

label{
    display:block;
    margin:18px 0 8px;
    color:#cdd2df;
    font-size:14px;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.06);
    color:white;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#397cff;
    box-shadow:0 0 0 3px rgba(57,124,255,.12);
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:55px;
}

.show-password{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#9da5b8;
    user-select:none;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#1d5cff,#1744c4);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    display:none;
    font-size:14px;
    text-align:center;
}

.error{
    display:block;
    background:rgba(255,60,60,.12);
    border:1px solid rgba(255,60,60,.3);
    color:#ff8585;
}

.success{
    display:block;
    background:rgba(40,200,120,.12);
    border:1px solid rgba(40,200,120,.3);
    color:#6ff0b0;
}

.register{
    text-align:center;
    margin-top:22px;
    color:#9da5b8;
    font-size:14px;
}

.register a{
    color:#4d8cff;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>MAX STORE</h1>
        <p>Welcome back</p>
    </div>

    <form id="loginForm">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
            autocomplete="email"
        >

        <label for="password">Password</label>

        <div class="password-box">
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >

            <span
                class="show-password"
                id="showPassword"
                onclick="togglePassword()"
            >👁</span>
        </div>

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

</div>


<script>

/* =========================================
   MAX STORE GOOGLE APPS SCRIPT API
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwe_fBlSg8zIkNhCAyMfCI9r_fmnzLoKdALH-rYJd_2BO-lrLgV6h-J7ZgoGdLt2swp3Q/exec";


/* =========================================
   ELEMENTS
========================================= */

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

function togglePassword(){

    const type =
        passwordInput.type === "password"
        ? "text"
        : "password";

    passwordInput.type = type;

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type="error"){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =========================================
   LOGIN
========================================= */

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        emailInput.value.trim().toLowerCase();

    const password =
        passwordInput.value;

    if(!email || !password){

        showMessage(
            "Please enter email and password.",
            "error"
        );

        return;
    }


    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";


    try{

        const response = await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:JSON.stringify({

                action:"login",

                email:email,

                password:password

            })

        });


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const result =
            await response.json();


        console.log("LOGIN RESPONSE:",result);


        if(!result.success){

            throw new Error(
                result.error ||
                result.message ||
                "Invalid email or password"
            );

        }


        /* =================================
           USER DATA
        ================================= */

        const user = result.user;

        if(!user){

            throw new Error(
                "Login successful but user data is missing."
            );

        }


        const role =
            String(user.role || "")
            .toLowerCase()
            .trim();


        /* =================================
           SAVE SESSION
        ================================= */

        localStorage.setItem(
            "maxstoreSession",
            JSON.stringify(user)
        );


        localStorage.setItem(
            "MAXSTORE_USER",
            JSON.stringify(user)
        );


        localStorage.setItem(
            "MAXSTORE_ROLE",
            role
        );


        showMessage(
            "Login successful. Redirecting...",
            "success"
        );


        /* =================================
           AUTOMATIC ROLE REDIRECT
        ================================= */

        setTimeout(function(){

            /* ADMIN */

            if(role === "admin"){

                window.location.href =
                    "admin/dashboard.html";

                return;
            }


            /* SELLER */

            if(role === "seller"){

                window.location.href =
                    "seller/dashboard.html";

                return;
            }


            /* BUYER + SELLER */

            if(
                role === "both" ||
                role === "buyer_seller"
            ){

                /*
                   Buyer & Seller account.
                   Open buyer dashboard first.
                   Seller dashboard can also be
                   accessed from the account.
                */

                window.location.href =
                    "buyer/dashboard.html";

                return;
            }


            /* BUYER */

            if(role === "buyer"){

                window.location.href =
                    "buyer/dashboard.html";

                return;
            }


            /* UNKNOWN ROLE */

            showMessage(
                "Unknown account role: " + role,
                "error"
            );

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";

        },700);


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            "Login failed: " +
            error.message,
            "error"
        );


        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

    }

});


/* =========================================
   ENTER KEY
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            form.requestSubmit();

        }

    }
);

</script>

</body>
</html>
