<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="navin"><a class="logo" href="/index.html">MAX <span>STORE</span></a><div class="navlinks"><a href="/index.html">Home</a><a href="/products.html">Products</a><a href="/products.html?category=Fashion">Fashion</a><a href="/products.html?category=Electronics">Electronics</a><a href="/products.html?category=Photo%20%26%20Camera">Photo & Camera</a></div><a href="/cart.html" class="btn">Cart <span id="cartCount">0</span></a><a href="/login.html" class="btn primary">Login</a></div></nav><main class="container"><div class="form panel"><h1>Create Account</h1><div class=field><label>Account type</label><select id=role><option value=buyer>Buyer</option><option value=seller>Seller</option><option value=both>Buyer & Seller</option></select></div><div class=field><label>Name</label><input class=input id=name></div><div class=field><label>Email</label><input class=input id=email type=email></div><div class=field><label>Phone</label><input class=input id=phone></div><div class=field><label>Store name (seller)</label><input class=input id=store></div><div class=field><label>Password</label><input class=input id=password type=password></div><button class="btn primary" onclick=reg()>Create Account</button><p id=msg></p></div></main><script src=/js/app.js></script><script>async function reg(){try{await api("register",{name:name.value,email:email.value,phone:phone.value,storeName:store.value,password:password.value,role:role.value});msg.className="success";msg.textContent="Account created. Login now.";setTimeout(()=>location.href="/login.html",700)}catch(e){msg.className="error";msg.textContent=e.message}}</script></body></html>
