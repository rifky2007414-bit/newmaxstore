<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Register — MAX STORE</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>
    .register-box {
      max-width: 520px;
      margin: 50px auto;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      width: 100%;
      box-sizing: border-box;
      padding-right: 90px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #00d4ff;
      cursor: pointer;
      font-weight: 600;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
    }

    .success {
      color: #22c55e;
      margin-top: 15px;
    }

    .error {
      color: #ef4444;
      margin-top: 15px;
    }

    .muted {
      color: #a6a8b3;
    }
  </style>
</head>

<body>

<nav class="nav">
  <div class="navin">

    <a class="logo" href="/index.html">
      MAX <span>STORE</span>
    </a>

    <div class="navlinks">
      <a href="/index.html">Home</a>
      <a href="/products.html">Products</a>
      <a href="/products.html?category=Fashion">Fashion</a>
      <a href="/products.html?category=Electronics">Electronics</a>
      <a href="/products.html?category=Photo%20%26%20Camera">
        Photo & Camera
      </a>
    </div>

    <a href="/cart.html" class="btn">
      Cart <span id="cartCount">0</span>
    </a>

    <a href="/login.html" class="btn primary">
      Login
    </a>

  </div>
</nav>


<main class="container">

  <div class="form panel register-box">

    <h1>Create Account</h1>

    <p class="muted">
      Create your MAX STORE account.
    </p>


    <!-- ACCOUNT TYPE -->

    <div class="field">

      <label for="role">
        Account Type
      </label>

      <select id="role" class="input">

        <option value="buyer">
          Buyer
        </option>

        <option value="seller">
          Seller
        </option>

        <option value="buyer_seller">
          Buyer & Seller
        </option>

      </select>

    </div>


    <!-- NAME -->

    <div class="field">

      <label for="name">
        Full Name
      </label>

      <input
        class="input"
        id="name"
        type="text"
        autocomplete="name"
        placeholder="Enter your full name"
      >

    </div>


    <!-- EMAIL -->

    <div class="field">

      <label for="email">
        Email
      </label>

      <input
        class="input"
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email"
      >

    </div>


    <!-- PHONE -->

    <div class="field">

      <label for="phone">
        Phone Number
      </label>

      <input
        class="input"
        id="phone"
        type="tel"
        autocomplete="tel"
        placeholder="07XXXXXXXX"
      >

    </div>


    <!-- STORE NAME -->

    <div class="field" id="storeBox">

      <label for="store">
        Store Name
      </label>

      <input
        class="input"
        id="store"
        type="text"
        autocomplete="organization"
        placeholder="Enter your store name"
      >

      <small class="muted">
        Required for Seller and Buyer & Seller.
      </small>

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label for="password">
        Password
      </label>

      <div class="password-wrap">

        <input
          class="input"
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="Enter password"
        >

        <button
          type="button"
          class="show-password"
          id="showPassword"
        >
          Show
        </button>

      </div>

    </div>


    <!-- CONFIRM PASSWORD -->

    <div class="field">

      <label for="confirmPassword">
        Confirm Password
      </label>

      <div class="password-wrap">

        <input
          class="input"
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Re-enter password"
        >

        <button
          type="button"
          class="show-password"
          id="showConfirmPassword"
        >
          Show
        </button>

      </div>

    </div>


    <!-- REGISTER BUTTON -->

    <button
      type="button"
      class="btn primary"
      id="registerBtn"
    >
      Create Account
    </button>


    <!-- MESSAGE -->

    <p id="msg"></p>


    <p class="muted">

      Already have an account?

      <a href="/login.html">
        Login
      </a>

    </p>

  </div>

</main>


<script src="/js/app.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const role =
  document.getElementById("role");

const nameInput =
  document.getElementById("name");

const emailInput =
  document.getElementById("email");

const phoneInput =
  document.getElementById("phone");

const storeInput =
  document.getElementById("store");

const storeBox =
  document.getElementById("storeBox");

const passwordInput =
  document.getElementById("password");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const registerBtn =
  document.getElementById("registerBtn");

const msg =
  document.getElementById("msg");

const showPassword =
  document.getElementById("showPassword");

const showConfirmPassword =
  document.getElementById("showConfirmPassword");


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showPassword.addEventListener("click", function () {

  if (passwordInput.type === "password") {

    passwordInput.type = "text";

    showPassword.textContent = "Hide";

  } else {

    passwordInput.type = "password";

    showPassword.textContent = "Show";

  }

});


showConfirmPassword.addEventListener("click", function () {

  if (confirmPasswordInput.type === "password") {

    confirmPasswordInput.type = "text";

    showConfirmPassword.textContent = "Hide";

  } else {

    confirmPasswordInput.type = "password";

    showConfirmPassword.textContent = "Show";

  }

});


/* =========================================
   SELLER FIELD
========================================= */

function updateSellerField() {

  if (role.value === "buyer") {

    storeBox.style.display = "none";

    storeInput.value = "";

  } else {

    storeBox.style.display = "block";

  }

}


role.addEventListener(
  "change",
  updateSellerField
);

updateSellerField();


/* =========================================
   REGISTER
========================================= */

registerBtn.addEventListener(
  "click",
  registerAccount
);


async function registerAccount() {

  clearMessage();


  const name =
    nameInput.value.trim();

  const email =
    emailInput.value.trim().toLowerCase();

  const phone =
    phoneInput.value.trim();

  const storeName =
    storeInput.value.trim();

  const password =
    passwordInput.value;

  const confirmPassword =
    confirmPasswordInput.value;

  const accountRole =
    role.value;


  /* ==============================
     VALIDATION
  ============================== */

  if (!name) {

    showError(
      "Please enter your name."
    );

    return;

  }


  if (!email) {

    showError(
      "Please enter your email."
    );

    return;

  }


  if (!phone) {

    showError(
      "Please enter your phone number."
    );

    return;

  }


  if (
    accountRole === "seller" ||
    accountRole === "buyer_seller"
  ) {

    if (!storeName) {

      showError(
        "Please enter your store name."
      );

      return;

    }

  }


  if (!password) {

    showError(
      "Please enter a password."
    );

    return;

  }


  if (password.length < 6) {

    showError(
      "Password must contain at least 6 characters."
    );

    return;

  }


  if (!confirmPassword) {

    showError(
      "Please confirm your password."
    );

    return;

  }


  if (password !== confirmPassword) {

    showError(
      "Passwords do not match."
    );

    return;

  }


  /* ==============================
     DISABLE BUTTON
  ============================== */

  registerBtn.disabled = true;

  registerBtn.textContent =
    "Creating Account...";


  try {


    /* ==============================
       SEND TO GOOGLE APPS SCRIPT
    ============================== */

    const result = await api(
      "register",
      {

        name: name,

        email: email,

        phone: phone,

        password: password,

        role: accountRole,

        storeName: storeName

      }
    );


    console.log(
      "Registration response:",
      result
    );


    /* ==============================
       CHECK RESPONSE
    ============================== */

    if (
      !result ||
      result.success !== true
    ) {

      throw new Error(
        result &&
        result.message
          ? result.message
          : "Registration failed."
      );

    }


    /* ==============================
       SUCCESS
    ============================== */

    showSuccess(
      "Account created successfully! Redirecting to Login..."
    );


    registerBtn.textContent =
      "Account Created";


    setTimeout(function () {

      window.location.href =
        "/login.html";

    }, 1500);


  } catch (error) {

    console.error(
      "Registration Error:",
      error
    );


    showError(
      error.message ||
      "Unable to create account."
    );


    registerBtn.disabled = false;

    registerBtn.textContent =
      "Create Account";

  }

}


/* =========================================
   MESSAGE FUNCTIONS
========================================= */

function clearMessage() {

  msg.textContent = "";

  msg.className = "";

}


function showError(message) {

  msg.className =
    "error";

  msg.textContent =
    message;

}


function showSuccess(message) {

  msg.className =
    "success";

  msg.textContent =
    message;

}

</script>

</body>
</html>
