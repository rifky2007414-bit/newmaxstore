<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — MAX STORE</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container"><div class="card form-card"><div class="eyebrow">MAX STORE</div><h1>Create your account</h1><p class="muted">Choose Buyer, Seller, or Buyer & Seller. Admin accounts are created by the backend owner setup.</p><form id="registerForm" novalidate><div class="field"><label for="role">Account type</label><select class="select" id="role"><option value="buyer">Buyer</option><option value="seller">Seller</option><option value="both">Buyer & Seller</option></select></div><div class="field"><label for="name">Full name</label><input class="input" id="name" required></div><div class="field"><label for="email">Email</label><input class="input" id="email" type="email" required></div><div class="field"><label for="phone">Phone</label><input class="input" id="phone" inputmode="tel"></div><div class="field" id="storeField" hidden><label for="storeName">Store name</label><input class="input" id="storeName"></div><div class="field"><label for="password">Password</label><input class="input" id="password" type="password" minlength="6" required></div><button class="btn primary" id="registerBtn" type="submit" style="width:100%">Create Account</button></form><div id="message" class="message"></div><p class="muted" style="text-align:center;margin-top:22px">Already registered? <a href="/login.html" style="color:#75a1ff">Login</a></p></div></main><script src="/js/config.js"></script><script src="/js/app.js"></script><script>
const roleEl=document.getElementById('role'),storeField=document.getElementById('storeField');roleEl.addEventListener('change',()=>storeField.hidden=!(roleEl.value==='seller'||roleEl.value==='both'));
document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('registerBtn'),msg=document.getElementById('message');btn.disabled=true;btn.textContent='Creating...';msg.className='message';msg.textContent='';const data={role:roleEl.value,name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim().toLowerCase(),phone:document.getElementById('phone').value.trim(),storeName:document.getElementById('storeName').value.trim(),password:document.getElementById('password').value};try{const r=await api('register',data);setMsg(msg,'Account created successfully. Redirecting to login...','success');setTimeout(()=>location.href='/login.html',900)}catch(err){setMsg(msg,err.message,'error');btn.disabled=false;btn.textContent='Create Account'}});
</script></body></html>
