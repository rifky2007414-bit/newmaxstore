<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="navin"><a class="logo" href="/index.html">MAX <span>STORE</span></a><div class="navlinks"><a href="/index.html">Home</a><a href="/products.html">Products</a><a href="/products.html?category=Fashion">Fashion</a><a href="/products.html?category=Electronics">Electronics</a><a href="/products.html?category=Photo%20%26%20Camera">Photo & Camera</a></div><a href="/cart.html" class="btn">Cart <span id="cartCount">0</span></a><a href="/login.html" class="btn primary">Login</a></div></nav><main class="container"><div style="display:flex;justify-content:space-between"><div><h1>Seller Dashboard</h1><p class=muted id=welcome></p></div><button class=btn onclick=logout()>Logout</button></div><div class=grid><div class="card stat"><span class=muted>Products</span><b id=pc>0</b></div><div class="card stat"><span class=muted>Orders</span><b id=oc>0</b></div><div class="card stat"><span class=muted>Gross Sales</span><b id=sales>Rs. 0</b></div><div class="card stat"><span class=muted>Your 90%</span><b id=share>Rs. 0</b></div></div><div class=grid2><div class=panel><h2>Add Product</h2><div class=field><label>Name</label><input class=input id=pn></div><div class=field><label>Category</label><select id=pcat></select></div><div class=field><label>Price</label><input class=input id=pp type=number></div><div class=field><label>Stock</label><input class=input id=ps type=number></div><div class=field><label>Image URL</label><input class=input id=pi></div><button class="btn primary" onclick=add()>Submit</button><p id=msg></p></div><div class=panel><h2>My Products</h2><div id=products>Loading...</div></div></div><div class=panel style="margin-top:15px"><h2>My Orders</h2><div id=orders>Loading...</div></div></main><script src=/js/app.js></script><script>const me=requireRole(["seller","both"]);CATEGORIES.forEach(c=>pcat.innerHTML+=`<option>${esc(c)}</option>`);if(me){welcome.textContent=me.name;load()}async function load(){try{let j=await api("sellerDashboard",{sellerId:me.userId}),ps=j.products||[],os=j.orders||[];pc.textContent=ps.length;oc.textContent=os.length;let g=os.reduce((a,o)=>a+o.amount,0);sales.textContent=money(g);share.textContent=money(g*.9);products.innerHTML=ps.map(p=>`<div class=cartline><span><b>${esc(p.name)}</b><br>${money(p.price)} • ${esc(p.status)}</span></div>`).join("")||"<p class=muted>No products.</p>";orders.innerHTML="<table><tr><th>Order</th><th>Amount</th><th>90%</th><th>Status</th></tr>"+os.map(o=>`<tr><td>${esc(o.orderId)}</td><td>${money(o.amount)}</td><td>${money(o.sellerAmount)}</td><td>${esc(o.status)}</td></tr>`).join("")+"</table>"}catch(e){msg.textContent=e.message;msg.className="error"}}async function add(){try{await api("addProduct",{sellerId:me.userId,name:pn.value,category:pcat.value,price:pp.value,stock:ps.value,image:pi.value});msg.className="success";msg.textContent="Submitted for admin approval.";load()}catch(e){msg.className="error";msg.textContent=e.message}}</script></body></html>
