<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard — MAX STORE</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="/">MAX <b>STORE</b></a><a class="btn" href="/products.html">Store</a><button class="btn danger" id="logoutBtn">Logout</button></div></header><main class="container"><div class="dashboard-head"><div><div class="eyebrow">SELLER CENTER</div><h1>Seller Dashboard</h1><p class="muted" id="welcome"></p></div><button class="btn primary" id="newProduct">+ Add product</button></div><div class="stats"><div class="card stat"><div class="label">Products</div><div class="value" id="pc">0</div></div><div class="card stat"><div class="label">Orders</div><div class="value" id="oc">0</div></div><div class="card stat"><div class="label">Seller earnings</div><div class="value" id="earn">Rs. 0.00</div></div><div class="card stat"><div class="label">Commission</div><div class="value">10%</div></div></div><section class="card" style="margin-top:20px" id="productForm" hidden><h2 id="formTitle">Add Product</h2><input type="hidden" id="editId"><div class="two"><div><label>Name</label><input class="input" id="pname"><label>Category</label><select class="select" id="pcat"></select><label>Price</label><input class="input" id="pprice" type="number" min="0.01" step="0.01"></div><div><label>Stock</label><input class="input" id="pstock" type="number" min="0"><label>Image URL</label><input class="input" id="pimage"><div style="margin-top:15px"><button class="btn primary" id="saveProduct">Save product</button> <button class="btn" id="cancelProduct">Cancel</button></div></div></div><div id="productMsg" class="message"></div></section><section class="card" style="margin-top:20px"><h2>My Products</h2><div id="products"></div></section><section class="card" style="margin-top:20px"><h2>My Orders</h2><div id="orders"></div></section></main><script src="/js/config.js"></script><script src="/js/app.js"></script><script>
const me=requireLogin(['seller','both']);document.getElementById('logoutBtn').onclick=logout;const form=document.getElementById('productForm'),msg=document.getElementById('productMsg');document.getElementById('pcat').innerHTML=CATEGORIES.map(x=>'<option>'+esc(x)+'</option>').join('');
function resetForm(){document.getElementById('editId').value='';document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pstock').value='';document.getElementById('pimage').value='';document.getElementById('formTitle').textContent='Add Product';form.hidden=true;msg.textContent=''}
document.getElementById('newProduct').onclick=()=>{form.hidden=false;document.getElementById('pname').focus()};document.getElementById('cancelProduct').onclick=resetForm;
async function load(){try{const r=await api('sellerDashboard',{sellerId:me.sellerId});const ps=r.products||[],os=r.orders||[];document.getElementById('welcome').textContent='Welcome, '+me.name+' • '+(me.sellerId||'');document.getElementById('pc').textContent=ps.length;document.getElementById('oc').textContent=os.length;document.getElementById('earn').textContent=money(os.reduce((n,x)=>n+Number(x.sellerAmount||0),0));document.getElementById('products').innerHTML=renderTable(['ID','Product','Price','Stock','Status','Actions'],ps.map(x=>[esc(x.productId),esc(x.name),money(x.price),x.stock,esc(x.status),'<button class="btn" onclick="editProduct('+JSON.stringify(x).replace(/</g,'\\u003c')+')">Edit</button> <button class="btn danger" onclick="deleteProduct(\''+esc(x.productId)+'\')">Delete</button>']));document.getElementById('orders').innerHTML=renderTable(['Order','Amount','Seller amount','Payment','Status'],os.map(x=>[esc(x.orderId),money(x.amount),money(x.sellerAmount),esc(x.paymentMethod),esc(x.status)]))}catch(e){document.getElementById('products').innerHTML='<p class="message error">'+esc(e.message)+'</p>'}}
window.editProduct=x=>{form.hidden=false;document.getElementById('formTitle').textContent='Edit Product';document.getElementById('editId').value=x.productId;document.getElementById('pname').value=x.name;document.getElementById('pcat').value=x.category;document.getElementById('pprice').value=x.price;document.getElementById('pstock').value=x.stock;document.getElementById('pimage').value=x.image||'';window.scrollTo({top:form.offsetTop-80,behavior:'smooth'})};
window.deleteProduct=async id=>{if(!confirm('Delete this product?'))return;try{await api('deleteProduct',{sellerId:me.sellerId,productId:id});showToast('Product deleted');load()}catch(e){alert(e.message)}};
document.getElementById('saveProduct').onclick=async()=>{const id=document.getElementById('editId').value;const data={sellerId:me.sellerId,name:document.getElementById('pname').value.trim(),category:document.getElementById('pcat').value,price:Number(document.getElementById('pprice').value),stock:Number(document.getElementById('pstock').value),image:document.getElementById('pimage').value.trim()};try{const r=await api(id?'updateProduct':'addProduct',id?{...data,productId:id}:data);setMsg(msg,id?'Product updated.':'Product submitted for admin approval.','success');setTimeout(()=>{resetForm();load()},500)}catch(e){setMsg(msg,e.message,'error')}};if(me)load();
</script></body></html>
